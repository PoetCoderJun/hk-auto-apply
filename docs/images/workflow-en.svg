<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">From your criteria to a running apply process</title>
<desc id="desc">Your resume and job criteria go to the agent, which searches JobsDB and LinkedIn, reads each JD, judges the match, deduplicates across platforms, applies, logs the result, and checks for new roles on a schedule. Unmatched roles or items that need review are logged separately.</desc>
<rect width="1200" height="520" rx="20" fill="#edf3f7"/>
<g font-family="sans-serif" fill="#173a4c">
<text x="58" y="60" font-size="17" letter-spacing="3">LINKEDIN AUTO APPLY</text>
<text x="58" y="114" font-size="37" font-weight="700">Turn your criteria into a running apply process</text>
<text x="58" y="151" font-size="19" fill="#476575">Browser Use / Computer Use · JobsDB + LinkedIn</text>
<g fill="none" stroke="#759faf" stroke-width="2">
<path d="M200 260 C275 260 275 260 350 260 M500 260 H610 M770 260 H890"/>
<path d="M962 310 C962 420 425 420 425 310" stroke-dasharray="7 7"/>
<path d="M690 306 Q690 358 800 358"/>
</g>
<g fill="#fff">
<circle cx="130" cy="260" r="64"/><circle cx="425" cy="260" r="77"/><circle cx="690" cy="260" r="77"/><circle cx="970" cy="260" r="77"/>
</g>
<g text-anchor="middle">
<text x="130" y="251" font-size="22" font-weight="700">Your brief</text><text x="130" y="282" font-size="15">Resume · Scope</text>
<text x="425" y="251" font-size="22" font-weight="700">Find roles</text><text x="425" y="282" font-size="15">Search · Read JDs</text>
<text x="690" y="251" font-size="22" font-weight="700">Match &amp; dedup</text><text x="690" y="282" font-size="15">Criteria · Cross-platform</text>
<text x="970" y="251" font-size="22" font-weight="700">Apply &amp; track</text><text x="970" y="282" font-size="15">Status · Reasons · Report</text>
</g>
<g fill="#39758d"><circle cx="256" cy="260" r="5"/><circle cx="552" cy="260" r="5"/><circle cx="832" cy="260" r="5"/></g>
<text x="810" y="365" font-size="17">Unmatched / needs review → logged</text>
<text x="694" y="444" font-size="19" fill="#39758d" text-anchor="middle">Check for new roles on your schedule, and continue this loop</text>
<text x="58" y="489" font-size="16" fill="#476575">Illustrative workflow. Coverage, results, and items needing review are written to the log.</text>
</g>
</svg>
